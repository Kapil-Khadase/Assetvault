  </defs>
  <rect width="120" height="120" rx="16" fill="url(#bgK)"/>
  <!-- Bangle 1 (Back) -->
  <ellipse cx="66" cy="54" rx="26" ry="18" fill="none" stroke="url(#goldK)" stroke-width="7" transform="rotate(-15 66 54)"/>
  <!-- Bangle 2 (Front) -->
